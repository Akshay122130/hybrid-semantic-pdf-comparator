[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-comparator"
version = "0.1.0"
description = "Hybrid Semantic PDF Comparison Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyMuPDF>=1.23.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
]



[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

